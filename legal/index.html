<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbox Vault — Legal</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px;
    color: #1a1a1a;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #111; }
    a { color: #4ea1ff; }
    .card { background: #1c1c1e; border-color: #333; }
  }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .subtitle { color: #888; margin-bottom: 32px; }
  .card {
    display: block;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    text-decoration: none;
    color: inherit;
    transition: transform .1s ease, border-color .1s ease;
  }
  .card:hover { transform: translateY(-1px); border-color: #4ea1ff; }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .card p { margin: 0; color: #777; font-size: 14px; }
  footer { margin-top: 48px; font-size: 13px; color: #999; }
</style>
</head>
